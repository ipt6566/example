<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>장애인 차량 조회</title>

    <style>

        body{
            font-family: Arial;
            max-width:700px;
            margin:auto;
            padding-top:50px;
        }

        input{
            width:300px;
            padding:10px;
            font-size:16px;
        }

        button{
            padding:10px 20px;
            font-size:16px;
        }

        .result{
            margin-top:30px;
            border:1px solid #ddd;
            padding:20px;
            background:#f5f5f5;
        }

    </style>

</head>
<body>

<h2>차량 조회</h2>

<form method="POST">

    <input
        type="text"
        name="car_number"
        placeholder="차량번호 입력"
        required>

    <button type="submit">
        조회
    </button>

</form>


{% if result1 %}

<div class="result">

    <h3>검증 1</h3>
    <p>{{ result1 }}</p>

    <hr>

    <h3>검증 2</h3>
    <p>{{ result2 }}</p>

</div>

{% endif %}

</body>
</html>
