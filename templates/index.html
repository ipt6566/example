<!DOCTYPE html>
<html>
<body>
    <h2>장애인차량 조회 서비스</h2>
    <input type="text" id="car_number" placeholder="차량번호 입력">
    <button onclick="checkParking()">조회하기</button>
    <div id="result"></div>

    <script>
        async function checkParking() {
            const carNumber = document.getElementById('car_number').value;
            const res = await fetch('/check', {
                method: 'POST',
                body: new URLSearchParams({car_number: carNumber})
            });
            const data = await res.json();
            document.getElementById('result').innerText = 
                `API 1: ${data.api1}\nAPI 2: ${data.api2}`;
        }
    </script>
</body>
</html>
