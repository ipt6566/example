<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>차량 조회</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
    background:linear-gradient(
        135deg,
        #eef2ff,
        #f8fafc
    );

    min-height:100vh;
}

.main-card{

    border:none;
    border-radius:25px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.12);
}

.result-card{

    border:none;
    border-radius:25px;

    box-shadow:
    0 5px 20px rgba(0,0,0,.1);
}

.car-number{

    font-size:2rem;
    font-weight:700;

    color:#2563eb;
}

</style>

</head>

<body>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-7">

<div class="card main-card p-5">

<h1 class="text-center mb-4">
🚗 차량 조회
</h1>

<form id="searchForm">

<div class="input-group input-group-lg">

<input
class="form-control"
id="car_number"
placeholder="예) 12가3456"
required>

<button
class="btn btn-primary"
id="searchButton">

조회

</button>

</div>

</form>

</div>


<div
class="card result-card mt-4 p-4"
id="resultCard"
style="display:none;">

<div class="text-center">

<div class="text-secondary">

조회 차량

</div>

<div
class="car-number"
id="carNumberDisplay">

</div>

</div>

<hr>

<div class="card bg-light border-0 p-3 mb-3">

<h5 class="text-primary">
검증 1
</h5>

<p id="result1"></p>

</div>


<div class="card bg-light border-0 p-3">

<h5 class="text-success">
검증 2
</h5>

<p id="result2"></p>

</div>

</div>

</div>

</div>

</div>


<script>

document
.getElementById("searchForm")
.addEventListener(
"submit",

async function(e){

    e.preventDefault();

    const carNumber =
        document
        .getElementById("car_number")
        .value;

    document
        .getElementById("resultCard")
        .style.display = "block";

    document
        .getElementById("carNumberDisplay")
        .innerText = carNumber;

    document
        .getElementById("result1")
        .innerHTML =
        "⏳ 조회중...";

    document
        .getElementById("result2")
        .innerHTML =
        "⏳ 조회중...";

    const button =
        document
        .getElementById("searchButton");

    button.disabled = true;

    button.innerText =
        "조회중...";

    try{

        const response =
            await fetch(
                "/search",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:
                    JSON.stringify({
                        car_number: carNumber
                    })

                }
            );

        const data =
            await response.json();

        document
            .getElementById("result1")
            .innerHTML =
            data.result1;

        document
            .getElementById("result2")
            .innerHTML =
            data.result2;

    }
    catch(error){

        document
            .getElementById("result1")
            .innerHTML =
            "오류 발생";

        document
            .getElementById("result2")
            .innerHTML =
            "";

    }

    button.disabled = false;

    button.innerText =
        "조회";

});

</script>

</body>
</html>
